# ============================================================
# WFB-ng конфигурация — БОРТ (drone)
# Orange Pi 3 Zero + OpenIPC MC800S-V3
# ============================================================
# Установка: /etc/wifibroadcast.cfg
# Запуск: systemctl start wifibroadcast@drone
#
# Потоки:
#   video0 (0x00): EO-камера OpenIPC (H.265) — GStreamer → UDP 5602
#   video1 (0x01): IR-камера (H.264) — Orange Pi → UDP 5603
#   mavlink (0x10/0x90): CUAV X7+ Pro (serial) — двунаправленный
#   tunnel (0x20/0xa0): IPoWB (SSH, диагностика)
# ============================================================

[common]
wifi_channel = 165          # 5.8 GHz @5825 MHz (дальность макс.)
wifi_region = 'BO'          # CRDA регион (макс. мощность TX)
wifi_txpower = 3000         # 8812eu: 30 dBm (для 8812au: -3000)
set_nm_unmanaged = True     # Отключить NetworkManager для wlan

# ─── Потоки борта ───
[drone]
streams = [
    {'name': 'video0', 'stream_rx': None, 'stream_tx': 0x00,
     'service_type': 'udp_direct_tx',
     'profiles': ['base', 'drone_base', 'video', 'drone_video0']},
    {'name': 'video1', 'stream_rx': None, 'stream_tx': 0x01,
     'service_type': 'udp_direct_tx',
     'profiles': ['base', 'drone_base', 'video', 'drone_video1']},
    {'name': 'mavlink', 'stream_rx': 0x90, 'stream_tx': 0x10,
     'service_type': 'mavlink',
     'profiles': ['base', 'drone_base', 'mavlink', 'drone_mavlink']},
    {'name': 'tunnel', 'stream_rx': 0xa0, 'stream_tx': 0x20,
     'service_type': 'tunnel',
     'profiles': ['base', 'drone_base', 'tunnel', 'drone_tunnel']},
]
stats_port = 8002
api_port = 8102
link_domain = "interceptor"

# ─── Видео EO (OpenIPC) ───
[drone_video0]
peer = 'listen://0.0.0.0:5602'   # GStreamer шлёт H.265 сюда
fwmark = 20
bandwidth = 20
mcs_index = 1
fec_k = 8
fec_n = 12

# ─── Видео IR (Orange Pi) ───
[drone_video1]
peer = 'listen://0.0.0.0:5603'   # GStreamer шлёт H.264 сюда
fwmark = 21
bandwidth = 20
mcs_index = 1
fec_k = 8
fec_n = 12

# ─── MAVLink (CUAV X7+ Pro) ───
[drone_mavlink]
# CUAV подключён к serial (TELEM2 → UART Orange Pi)
peer = 'serial:ttyAMA0:921600'
# Альтернатива: через mavlink-router
# peer = 'listen://0.0.0.0:14560'
fwmark = 10
mavlink_sys_id = 3
mavlink_comp_id = 68
mavlink_tcp_port = 5760        # для QGC/MP на борту (диагностика)

# ─── Туннель (SSH) ───
[drone_tunnel]
fwmark = 30
ifname = 'drone-wfb'
ifaddr = '10.5.0.2/24'
default_route = False