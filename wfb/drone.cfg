# ============================================================
# WFB-ng конфигурация — БОРТ (drone)
# Orange Pi 3 Zero + OpenIPC MC800S-V3
# WiFi: RTL8812AU
# Версия wfb-ng: 26.8.x
# ============================================================
# Установка: /etc/wifibroadcast.cfg
# Запуск: systemctl start wifibroadcast@drone
#
# Потоки:
#   video0 (0x00): EO-камера OpenIPC (H.265) — UDP 5602
#   video1 (0x01): IR-камера (H.264) — Orange Pi → UDP 5603
#   mavlink (0x10/0x90): CUAV X7+ Pro — двунаправленный
#   tunnel (0x20/0xa0): IPoWB (SSH, диагностика)
# ============================================================

[common]
wifi_channel = 165
wifi_region = 'BO'
wifi_txpower = -3000          # 8812au: 30 dBm (-dBm * 100)
set_nm_unmanaged = True
tx_rc_buf_size = 131072       # Буфер приёмника (128 KB)
udp_buf_size = 2097152        # Буфер UDP (2 MB)

[drone]
streams = [
    {'name': 'video0', 'stream_rx': None, 'stream_tx': 0x00,
     'service_type': 'udp_direct_tx',
     'profiles': ['base', 'drone_base', 'video', 'drone_video0']},
    {'name': 'video1', 'stream_rx': None, 'stream_tx': 0x01,
     'service_type': 'udp_direct_tx',
     'profiles': ['base', 'drone_base', 'video', 'drone_video1']},
    {'name': 'mavlink', 'stream_rx': 0x90, 'stream_tx': 0x10,
     'service_type': 'mavlink',
     'profiles': ['base', 'drone_base', 'mavlink', 'drone_mavlink']},
    {'name': 'tunnel', 'stream_rx': 0xa0, 'stream_tx': 0x20,
     'service_type': 'tunnel',
     'profiles': ['base', 'drone_base', 'tunnel', 'drone_tunnel']},
]
stats_port = 8002
api_port = 8102
link_domain = "interceptor"

# ─── Базовый профиль (общие параметры физического уровня) ───
[base]
bandwidth = 20                # 20 MHz (устойчивее, меньше помех)
short_gi = True               # Short Guard Interval (+10% throughput)
stbc = 1                      # Space-Time Block Coding (лучший приём)
ldpc = True                   # Low-Density Parity Check (коррекция ошибок)

# ─── Видео EO (OpenIPC H.265) ───
[drone_video0]
peer = 'listen://0.0.0.0:5602'
fwmark = 20
bandwidth = 20
mcs_index = 1                 # MCS1: QPSK, ~6.5 Mbps @ SGI — баланс скорости/устойчивости
short_gi = True
stbc = 1
ldpc = True
fec_k = 8
fec_n = 12                    # 33% FEC overhead

# ─── Видео IR (Orange Pi H.264) ───
[drone_video1]
peer = 'listen://0.0.0.0:5603'
fwmark = 21
bandwidth = 20
mcs_index = 1
short_gi = True
stbc = 1
ldpc = True
fec_k = 8
fec_n = 12

# ─── MAVLink (CUAV X7+ Pro) ───
# ТЕСТ: CUAV подключён по USB → /dev/ttyACM1
# ПРОД: переключить на UART → peer = 'serial:ttyAMA0:921600'
#       и настроить SERIAL2_PROTOCOL=2, SERIAL2_BAUD=921 через setup_telem2.py
[drone_mavlink]
peer = 'serial:ttyACM1:115200'
fwmark = 10
bandwidth = 20
mcs_index = 0                 # MCS0: BPSK, ~3 Mbps — максимальная устойчивость для управления
short_gi = True
stbc = 1
ldpc = True
fec_k = 1
fec_n = 2                     # 50% FEC — максимальная надёжность команд
mavlink_sys_id = 3
mavlink_comp_id = 68
mavlink_tcp_port = 5760

# ─── Туннель (SSH, диагностика) ───
[drone_tunnel]
fwmark = 30
bandwidth = 20
mcs_index = 0
short_gi = True
stbc = 1
ldpc = True
fec_k = 2
fec_n = 3                     # 33% FEC
ifname = 'drone-wfb'
ifaddr = '10.5.0.2/24'
default_route = False
