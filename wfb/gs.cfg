# ============================================================
# WFB-ng конфигурация — ЗЕМЛЯ (gs)
# Jetson Orin Nano (НСУ)
# WiFi: RTL8812AU
# ============================================================
# Установка: /etc/wifibroadcast.cfg
# Запуск: systemctl start wifibroadcast@gs
#
# Потоки:
#   video0 (0x00): EO-видео → UDP 5600 (ROS2 video_publisher)
#   video1 (0x01): IR-видео → UDP 5601 (ROS2 video_publisher)
#   mavlink (0x10/0x90): MAVLink → UDP 14550 (mavlink_bridge)
#   tunnel (0x20/0xa0): IPoWB (SSH, диагностика)
# ============================================================

[common]
wifi_channel = 165            # Тот же канал, что на борту!
wifi_region = 'BO'
wifi_txpower = -3000          # 8812au: 30 dBm (-dBm * 100)
set_nm_unmanaged = True
tx_rc_buf_size = 131072       # Буфер приёмника (128 KB)
udp_buf_size = 2097152        # Буфер UDP (2 MB)

# ─── Потоки земли ───
[gs]
streams = [
    {'name': 'video0', 'stream_rx': 0x00, 'stream_tx': None,
     'service_type': 'udp_direct_rx',
     'profiles': ['base', 'gs_base', 'video', 'gs_video0']},
    {'name': 'video1', 'stream_rx': 0x01, 'stream_tx': None,
     'service_type': 'udp_direct_rx',
     'profiles': ['base', 'gs_base', 'video', 'gs_video1']},
    {'name': 'mavlink', 'stream_rx': 0x10, 'stream_tx': 0x90,
     'service_type': 'mavlink',
     'profiles': ['base', 'gs_base', 'mavlink', 'gs_mavlink']},
    {'name': 'tunnel', 'stream_rx': 0x20, 'stream_tx': 0xa0,
     'service_type': 'tunnel',
     'profiles': ['base', 'gs_base', 'tunnel', 'gs_tunnel']},
]
stats_port = 8003
api_port = 8103
link_domain = "interceptor"

# ─── Базовый профиль (общие параметры физического уровня) ───
[base]
bandwidth = 20                # 20 MHz (устойчивее, меньше помех)
short_gi = True               # Short Guard Interval (+10% throughput)
stbc = 1                      # Space-Time Block Coding (лучший приём)
ldpc = True                   # Low-Density Parity Check (коррекция ошибок)

# ─── Видео EO (приём) ───
[gs_video0]
peer = 'connect://127.0.0.1:5600'   # ROS2 video_publisher слушает здесь
fwmark = 20
bandwidth = 20
mcs_index = 1                 # MCS1: QPSK — соответствует борту
short_gi = True
stbc = 1
ldpc = True
fec_k = 8
fec_n = 12                    # 33% FEC overhead

# ─── Видео IR (приём) ───
[gs_video1]
peer = 'connect://127.0.0.1:5601'   # ROS2 video_publisher слушает здесь
fwmark = 21
bandwidth = 20
mcs_index = 1
short_gi = True
stbc = 1
ldpc = True
fec_k = 8
fec_n = 12

# ─── MAVLink (двунаправленный) ───
[gs_mavlink]
peer = 'connect://127.0.0.1:14550'  # mavlink_bridge слушает здесь
fwmark = 10
bandwidth = 20
mcs_index = 0                 # MCS0: BPSK — максимальная устойчивость
short_gi = True
stbc = 1
ldpc = True
fec_k = 1
fec_n = 2                     # 50% FEC — максимальная надёжность команд
mavlink_sys_id = 3
mavlink_comp_id = 68

# ─── Туннель (SSH, диагностика) ───
[gs_tunnel]
fwmark = 30
bandwidth = 20
mcs_index = 0
short_gi = True
stbc = 1
ldpc = True
fec_k = 2
fec_n = 3                     # 33% FEC
ifname = 'gs-wfb'
ifaddr = '10.5.0.1/24'
default_route = False