# ============================================================
# WFB-ng конфигурация — ЗЕМЛЯ (gs)
# Jetson Orin Nano (НСУ)
# ============================================================
# Установка: /etc/wifibroadcast.cfg
# Запуск: systemctl start wifibroadcast@gs
#
# Потоки:
#   video0 (0x00): EO-видео → UDP 5600 (wfb_video_receiver)
#   video1 (0x01): IR-видео → UDP 5601 (wfb_video_receiver)
#   mavlink (0x10/0x90): MAVLink → UDP 14550 (mavlink_bridge)
#   tunnel (0x20/0xa0): IPoWB (SSH)
# ============================================================

[common]
wifi_channel = 165          # Тот же канал, что на борту!
wifi_region = 'BO'
wifi_txpower = 3000         # 8812eu: 30 dBm
set_nm_unmanaged = True

# ─── Потоки земли ───
[gs]
streams = [
    {'name': 'video0', 'stream_rx': 0x00, 'stream_tx': None,
     'service_type': 'udp_direct_rx',
     'profiles': ['base', 'gs_base', 'video', 'gs_video0']},
    {'name': 'video1', 'stream_rx': 0x01, 'stream_tx': None,
     'service_type': 'udp_direct_rx',
     'profiles': ['base', 'gs_base', 'video', 'gs_video1']},
    {'name': 'mavlink', 'stream_rx': 0x10, 'stream_tx': 0x90,
     'service_type': 'mavlink',
     'profiles': ['base', 'gs_base', 'mavlink', 'gs_mavlink']},
    {'name': 'tunnel', 'stream_rx': 0x20, 'stream_tx': 0xa0,
     'service_type': 'tunnel',
     'profiles': ['base', 'gs_base', 'tunnel', 'gs_tunnel']},
]
stats_port = 8003
api_port = 8103
link_domain = "interceptor"

# ─── Видео EO (приём) ───
[gs_video0]
peer = 'connect://127.0.0.1:5600'   # wfb_video_receiver слушает здесь
fwmark = 20
bandwidth = 20
mcs_index = 1
fec_k = 8
fec_n = 12

# ─── Видео IR (приём) ───
[gs_video1]
peer = 'connect://127.0.0.1:5601'   # wfb_video_receiver слушает здесь
fwmark = 21
bandwidth = 20
mcs_index = 1
fec_k = 8
fec_n = 12

# ─── MAVLink (двунаправленный) ───
[gs_mavlink]
peer = 'connect://127.0.0.1:14550'  # mavlink_bridge слушает здесь
fwmark = 10
mavlink_sys_id = 3
mavlink_comp_id = 68

# ─── Туннель (SSH) ───
[gs_tunnel]
fwmark = 30
ifname = 'gs-wfb'
ifaddr = '10.5.0.1/24'
default_route = False